<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PayPerUsed</title>
<link rel="manifest" href="manifest.json">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f172a; --surface: #1e293b; --surface2: #334155; --border: #475569;
    --accent: #6366f1; --accent2: #818cf8; --green: #22c55e; --red: #f87171;
    --text: #f1f5f9; --muted: #94a3b8;
    --owe-text: #fca5a5; --get-text: #86efac; --row-bg: rgba(15,23,42,.5);
    --toast-bg: rgba(51,65,85,.96); --toast-text: #f1f5f9;
    --shadow-k: 1;   /* ความเข้มเงา — ธีมสว่างใช้เงาจางกว่า */
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #eef2f7; --surface: #ffffff; --surface2: #f1f5f9; --border: #cbd5e1;
      --accent: #6366f1; --accent2: #4f46e5; --green: #15803d; --red: #dc2626;
      --text: #0f172a; --muted: #64748b;
      --owe-text: #dc2626; --get-text: #15803d; --row-bg: rgba(255,255,255,.8);
      --toast-bg: rgba(15,23,42,.92); --toast-text: #f8fafc;
      --shadow-k: .35;
      color-scheme: light;
    }
  }
  :focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
  input:focus-visible, select:focus-visible { outline: none; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    display: grid; max-width: 560px; margin: 0 auto; overscroll-behavior-y: none;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "header" "main" "nav";
  }

  header {
    grid-area: header;
    padding: 16px 16px 12px;
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 4px 14px rgb(0 0 0 / calc(.22 * var(--shadow-k))); position: relative; z-index: 5;
  }
  header h1 { font-size: 19px; font-weight: 800; letter-spacing: -.01em; color: var(--accent2); }
  .sync-badge { display: flex; align-items: center; gap: 6px; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 5px 10px 5px 8px; }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; transition: background .2s, box-shadow .2s; }
  .sync-label { font-size: 11.5px; color: var(--muted); font-family: monospace; }

  .bottom-nav {
    grid-area: nav;
    display: flex; background: var(--surface); border-top: 1px solid var(--border);
    padding-bottom: var(--safe-bottom); box-shadow: 0 -4px 16px rgb(0 0 0 / calc(.28 * var(--shadow-k)));
    position: relative; z-index: 5;
  }
  .nav-item {
    border: none; background: none; font: inherit;
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; min-height: 54px; padding: 7px 2px 6px; position: relative;
    color: var(--muted); cursor: pointer; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; transition: color .2s;
  }
  .nav-item::before {
    content: ''; position: absolute; top: 0; left: 50%; width: 28px; height: 3px;
    border-radius: 0 0 5px 5px; background: var(--accent);
    transform: translateX(-50%) scaleX(0); transition: transform .2s ease;
  }
  .nav-item.active { color: var(--accent2); }
  .nav-item.active::before { transform: translateX(-50%) scaleX(1); }
  .nav-item .nav-icon { font-size: 21px; line-height: 1; transition: transform .2s ease; }
  .nav-item.active .nav-icon { transform: translateY(-1px) scale(1.08); }
  .nav-item .nav-label { font-size: 10.5px; font-weight: 600; letter-spacing: .01em; }

  main { grid-area: main; min-height: 0; overflow-y: auto; overscroll-behavior-y: contain; padding: 16px; padding-bottom: 24px; -webkit-overflow-scrolling: touch; }
  .page { display: none; }
  .page.active { display: block; animation: pageIn .22s ease; }
  @keyframes pageIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 12px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 6px 16px rgb(0 0 0 / calc(.2 * var(--shadow-k)));
  }
  .card-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; }

  input, select {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 11px 12px; color: var(--text); font-size: 16px;
    outline: none; transition: border-color .2s; -webkit-appearance: none; touch-action: manipulation;
  }
  input:focus, select:focus { border-color: var(--accent); }
  input::placeholder { color: var(--muted); }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; margin-top: 10px; }
  label:first-child { margin-top: 0; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px; padding: 11px 18px; border-radius: 10px; font-size: 15px; font-weight: 600;
    border: none; cursor: pointer; transition: opacity .15s, transform .1s, box-shadow .15s;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .btn:active { transform: scale(.97); opacity: .85; }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; width: 100%; box-shadow: 0 6px 16px rgba(99,102,241,.35); }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-danger { background: transparent; border: none; color: var(--red); padding: 8px; font-size: 18px; min-height: 40px; min-width: 40px; }
  .icon-btn {
    width: 38px; height: 38px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
    font-size: 15px; color: var(--text); cursor: pointer;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    transition: transform .1s, border-color .15s;
  }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn.danger { border-color: rgba(248,113,113,.35); }
  .btn-sm { padding: 7px 12px; font-size: 13px; min-height: 38px; }

  .member-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .chip {
    display: flex; align-items: center; gap: 2px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 20px; padding: 5px 4px 5px 12px; font-size: 14px;
  }
  .chip.chip-me { border-color: var(--accent); background: rgba(99,102,241,.12); }
  .chip-qr-btn { background: none; border: none; cursor: pointer; font-size: 15px; padding: 8px; line-height: 1; opacity: .5; transition: opacity .15s; touch-action: manipulation; }
  .chip-qr-btn.has-qr { opacity: 1; }
  .chip-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 8px; touch-action: manipulation; }
  .chip-del:hover { color: var(--red); }

  .add-row { display: flex; gap: 8px; }
  .add-row input { flex: 1; }

  .expense-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px;
    margin-bottom: 8px; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
    box-shadow: 0 4px 12px rgb(0 0 0 / calc(.18 * var(--shadow-k)));
  }
  .expense-info { flex: 1; min-width: 0; }
  .expense-name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .expense-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .expense-amount { font-weight: 700; font-size: 16px; color: var(--accent2); white-space: nowrap; }

  .check-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .check-item {
    display: flex; align-items: center; gap: 6px; min-height: 40px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 20px; padding: 6px 14px; cursor: pointer;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    transition: border-color .15s, background .15s;
  }
  .check-item.selected { border-color: var(--accent); background: rgba(99,102,241,.15); }
  button.check-item { font: inherit; color: var(--text); }

  .label-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 10px; }
  .label-row label { margin: 0 0 4px; }
  .link-btn {
    background: none; border: none; padding: 4px 2px; font: inherit; font-size: 13px; font-weight: 600;
    color: var(--accent2); cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  input.invalid, select.invalid { border-color: var(--red); }
  .split-preview {
    margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-size: 14px; line-height: 1.6;
    background: rgba(99,102,241,.1); border: 1px solid rgba(99,102,241,.28);
  }
  .split-preview.empty-hint { background: var(--surface2); border-color: var(--border); color: var(--muted); font-size: 13px; }
  .split-preview b { color: var(--accent2); }
  .split-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

  [hidden] { display: none !important; }
  .scan-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .scan-row .btn { flex-shrink: 0; }
  .scan-usage { font-size: 12px; color: var(--muted); }
  .scan-usage.low { color: var(--text); font-weight: 600; }
  .scan-usage.out { color: var(--red); font-weight: 600; }
  .scan-info {
    margin: 4px 0 6px; padding: 9px 12px; border-radius: 10px; font-size: 13px; line-height: 1.6;
    background: rgba(99,102,241,.1); border: 1px solid rgba(99,102,241,.28);
  }
  .scan-info.warn { background: rgba(245,158,11,.12); border-color: rgba(245,158,11,.45); }
  .spin { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .check-item span { font-size: 14px; }

  .weight-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .weight-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .weight-item span { font-size: 12px; color: var(--muted); }
  .weight-item input { width: 60px; text-align: center; padding: 7px 8px; }

  .section-title {
    font-size: 14px; font-weight: 700; color: var(--accent2);
    margin: 20px 0 10px; display: flex; align-items: center; gap: 8px;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .res-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 8px; box-shadow: 0 4px 12px rgb(0 0 0 / calc(.18 * var(--shadow-k)));
  }
  .res-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .res-name { font-weight: 700; font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .res-amount { font-weight: 800; font-size: 16px; color: var(--accent2); flex-shrink: 0; }
  .res-payer { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .res-shares { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed rgba(71,85,105,.55); }
  .share-pill { background: var(--surface2); border-radius: 14px; padding: 4px 10px; font-size: 12.5px; color: var(--muted); }
  .share-pill b { color: var(--text); font-weight: 700; }

  .person-row { display: flex; align-items: center; gap: 10px; padding: 11px 2px; border-bottom: 1px solid rgba(71,85,105,.35); }
  .person-row:last-child { border-bottom: none; }
  .person-avatar {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 14px; color: #fff;
  }
  .person-main { flex: 1; min-width: 0; }
  .person-name { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .person-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }


  .transfer-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px;
    margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px;
    box-shadow: 0 4px 12px rgb(0 0 0 / calc(.18 * var(--shadow-k))); transition: opacity .2s;
  }
  .transfer-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .transfer-names { font-size: 15px; flex: 1; min-width: 0; }
  .transfer-names .arrow { color: var(--muted); margin: 0 6px; }
  .transfer-amount { font-size: 17px; font-weight: 700; color: var(--accent2); flex-shrink: 0; }
  .transfer-actions { display: flex; gap: 8px; }
  .pay-btn {
    flex: 2; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border: none;
    border-radius: 10px; padding: 9px; min-height: 42px; font-size: 14px; font-weight: 700;
    cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    box-shadow: 0 4px 12px rgba(99,102,241,.3);
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .pay-btn:active { opacity: .85; transform: scale(.98); }
  .qr-scan-btn {
    background: rgba(34,197,94,.15); border: 1px solid rgba(34,197,94,.3);
    color: var(--green); border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 600;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    display: flex; align-items: center; gap: 4px;
  }
  .transfer-item.settled { opacity: .5; }
  .transfer-item.settled .transfer-amount { text-decoration: line-through; }
  .settle-btn {
    flex: 1; background: transparent; border: 1.5px solid var(--accent2);
    color: var(--text); border-radius: 10px; padding: 9px; min-height: 42px; font-size: 13px; font-weight: 600;
    cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; white-space: nowrap;
    transition: background .15s, color .15s, border-color .15s;
  }
  .settle-btn.done { background: rgba(34,197,94,.18); border-color: rgba(34,197,94,.4); color: var(--green); }
  .slip-thumb {
    background: var(--surface2); border-radius: 12px; padding: 12px;
    display: flex; justify-content: center; margin-bottom: 12px;
  }
  .slip-thumb img { max-width: 100%; max-height: 320px; border-radius: 8px; display: block; }
  .pay-sec-label { font-size: 13px; font-weight: 600; color: var(--muted); margin: 4px 0 8px; }

  .summary-card { display: flex; gap: 8px; }
  .summary-box {
    flex: 1; min-width: 0; background: linear-gradient(160deg, var(--surface), rgba(99,102,241,.08));
    border: 1px solid var(--border); border-radius: 14px; padding: 12px 6px; text-align: center;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 4px 12px rgb(0 0 0 / calc(.18 * var(--shadow-k)));
  }
  .summary-box .s-val { font-size: 19px; font-weight: 800; color: var(--accent2); letter-spacing: -.02em; }
  .summary-box .s-label { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .results-trip-name { font-size: 19px; font-weight: 800; margin-bottom: 10px; }
  .settle-progress { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .progress-track { height: 6px; background: var(--surface2); border-radius: 6px; overflow: hidden; margin: 6px 0 12px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--green), #4ade80); border-radius: 6px; transition: width .35s ease; }

  .empty {
    text-align: center; color: var(--muted); padding: 36px 20px; font-size: 14px; line-height: 1.8;
    background: var(--surface); border: 1px dashed var(--border); border-radius: 16px;
  }
  .empty .icon { font-size: 40px; display: block; margin-bottom: 8px; opacity: .85; }

  .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
  .badge-green { background: rgba(34,197,94,.15); color: var(--green); }
  .badge-red { background: rgba(248,113,113,.15); color: var(--red); }
  .badge-neutral { background: var(--surface2); color: var(--muted); }

  .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .toggle-label { font-size: 13px; color: var(--muted); }
  .toggle { position: relative; width: 44px; height: 24px; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: var(--surface2); border-radius: 24px; cursor: pointer; transition: background .2s; border: 1px solid var(--border); }
  .slider::before { content: ''; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px; background: var(--muted); border-radius: 50%; transition: transform .2s, background .2s; }
  .toggle input:checked + .slider { background: rgba(99,102,241,.3); border-color: var(--accent); }
  .toggle input:checked + .slider::before { transform: translateX(20px); background: var(--accent2); }

  .toast {
    position: fixed; bottom: calc(78px + var(--safe-bottom)); left: 50%; transform: translateX(-50%) translateY(20px);
    display: flex; align-items: center; gap: 14px; width: max-content; max-width: min(440px, calc(100vw - 32px));
    background: var(--toast-bg); border: 1px solid rgba(255,255,255,.08); color: var(--toast-text);
    padding: 11px 20px; border-radius: 22px; font-size: 14px; font-weight: 500; line-height: 1.45; text-align: center;
    box-shadow: 0 10px 30px rgb(0 0 0 / calc(.4 * var(--shadow-k))); backdrop-filter: blur(8px);
    opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.show.has-action { pointer-events: auto; }
  .toast-action {
    flex-shrink: 0; background: none; border: none; padding: 6px 2px; margin: -6px 0;
    font: inherit; font-weight: 700; color: #a5b4fc; cursor: pointer; touch-action: manipulation;
  }
  .toast-action:empty { display: none; }
  .btn-destructive { background: #dc2626; color: #fff; }

  select option { background: var(--surface2); }

  .form-modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 50;
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .25s;
    backdrop-filter: blur(3px);
  }
  .form-modal-backdrop.open { opacity: 1; pointer-events: all; }
  .form-modal {
    background: var(--surface); border-radius: 24px 24px 0 0; width: 100%; max-width: 480px;
    border-top: 1px solid var(--border);
    padding: 12px 16px 20px; padding-bottom: calc(20px + var(--safe-bottom));
    max-height: 88vh; max-height: 88dvh; overflow-y: auto; overscroll-behavior: contain;
    box-shadow: 0 -12px 40px rgb(0 0 0 / calc(.5 * var(--shadow-k)));
    transform: translateY(100%); transition: transform .3s cubic-bezier(.32,.72,0,1);
  }
  .form-modal-backdrop.open .form-modal { transform: translateY(0); }
  .modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 4px; margin: 0 auto 16px; }
  .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .modal-sub { font-size: 13px; color: var(--muted); margin-bottom: 16px; }

  .session-id-box {
    background: var(--surface2); border-radius: 8px; padding: 10px 12px;
    font-family: monospace; font-size: 18px; letter-spacing: .15em;
    text-align: center; color: var(--accent2); font-weight: 700; margin-bottom: 10px;
  }
  .identity-row {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(99,102,241,.1); border: 1px solid rgba(99,102,241,.3);
    border-radius: 8px; padding: 8px 12px; margin-bottom: 10px;
  }
  .identity-row .me-label { font-size: 12px; color: var(--muted); }
  .identity-row .me-name { font-weight: 700; color: var(--accent2); font-size: 15px; }

  /* QR modal specific */
  .qr-img-wrap {
    background: #fff; border-radius: 12px; padding: 16px;
    display: flex; justify-content: center; margin-bottom: 16px;
  }
  .qr-img-wrap img { max-width: 260px; width: 100%; display: block; border-radius: 4px; }
  .qr-empty {
    background: var(--surface2); border-radius: 12px; padding: 40px 20px;
    text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 16px;
  }

  /* Identity choice grid */
  .identity-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
  .identity-choice {
    font: inherit; color: var(--text); width: 100%;
    background: var(--surface2); border: 2px solid var(--border); border-radius: 14px;
    padding: 16px 10px; text-align: center; cursor: pointer;
    transition: border-color .15s, background .15s, transform .1s;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .identity-choice:active { transform: scale(.97); }
  .identity-choice:hover { border-color: var(--accent2); }
  .identity-choice .ic-name { display: block; font-weight: 600; font-size: 15px; margin-bottom: 4px; }

<script>
firebase.initializeApp({
  apiKey: "AIzaSyAhkK7cl2-ek9LrQGhisyvKacQ21Qru6Xs",
  authDomain: "payperused.firebaseapp.com",
  databaseURL: "https://payperused-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "payperused",
  storageBucket: "payperused.firebasestorage.app",
  messagingSenderId: "669339319561",
  appId: "1:669339319561:web:4a74ca139700c6c3b667d8"
});
const db = firebase.database();

// ─── State ────────────────────────────────────────────────────────────────────
let state = { members: [], expenses: [], qrcodes: {}, settled: {}, slips: {}, tripName: '' };
let editingExpenseId = null;

const SESSION_TTL_MS = 15 * 24 * 60 * 60 * 1000; // 15 วัน

// URL ของ Cloudflare Worker ที่ถือ Gemini API key และคุมโควตา (ดู worker/README.md) — ว่างไว้ = ซ่อนปุ่มสแกนบิล
// ห้ามใส่ API key ในไฟล์นี้: repo เป็น public และ GitHub Pages เสิร์ฟทุกไฟล์
const SCAN_API_URL = 'https://payperused-scan.nakarin-guy.workers.dev';

// ─── Session ──────────────────────────────────────────────────────────────────
let sessionId = null, isSharedSession = false;
let isSyncingFromRemote = false, sessionRef = null;
let identityModalShown = false;

// ─── Toast ────────────────────────────────────────────────────────────────────
// toast('ข้อความ') หรือ toast('ลบแล้ว', { action: 'เลิกทำ', onAction }) — มีปุ่มจะค้างนานขึ้นให้ทันกด
let toastTimer = null, toastActionFn = null;
function toast(msg, opts = {}) {
  const el = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  document.getElementById('toast-action').textContent = opts.action || '';
  toastActionFn = opts.onAction || null;
  el.classList.toggle('has-action', !!opts.action);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, opts.action ? 5000 : 2200);
}
function hideToast() { document.getElementById('toast').classList.remove('show'); toastActionFn = null; }
function onToastAction() { const fn = toastActionFn; hideToast(); if (fn) fn(); }

// ─── Confirm sheet ────────────────────────────────────────────────────────────
let confirmResolve = null;
function confirmSheet({ title, message, confirmLabel }) {
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-msg').textContent = message;
  document.getElementById('confirm-ok').textContent = confirmLabel;
  document.getElementById('confirm-modal').classList.add('open');
  document.getElementById('confirm-cancel').focus();
  return new Promise(resolve => { confirmResolve = resolve; });
}
function closeConfirm(result) {
  document.getElementById('confirm-modal').classList.remove('open');
  if (confirmResolve) { confirmResolve(result); confirmResolve = null; }
}

// ─── Tabs ─────────────────────────────────────────────────────────────────────
document.querySelectorAll('.nav-item').forEach(t => {
  t.addEventListener('click', () => {
    if (t.classList.contains('active')) { document.querySelector('main').scrollTo({ top: 0, behavior: 'smooth' }); return; }
    document.querySelectorAll('.nav-item').forEach(x => { x.classList.remove('active'); x.removeAttribute('aria-current'); });
    document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    t.setAttribute('aria-current', 'page');
    document.getElementById('page-' + t.dataset.tab).classList.add('active');
    document.querySelector('main').scrollTop = 0;
    if (t.dataset.tab === 'results') renderResults();
  });
});

// ─── Storage ──────────────────────────────────────────────────────────────────
function loadLocalState() {
  const s = localStorage.getItem('payperused');
  state = s ? JSON.parse(s) : { members: [], expenses: [], qrcodes: {}, settled: {}, slips: {}, tripName: '' };
  if (!state.qrcodes) state.qrcodes = {};
  if (!state.settled) state.settled = {};
  if (!state.slips) state.slips = {};
  if (state.tripName == null) state.tripName = '';
}

function persistLocal() {
  localStorage.setItem('payperused', JSON.stringify(state));
}

function saveState() {
  if (isSharedSession && !isSyncingFromRemote) {
    sessionRef.set(state);
    touchSessionMeta();
  } else if (!isSharedSession) {
    persistLocal();
  }
}

function normalizeState(data) {
  const toArr = v => !v ? [] : Array.isArray(v) ? v : Object.values(v);
  return {
    members: toArr(data.members),
    expenses: toArr(data.expenses),
    qrcodes: data.qrcodes || {},
    settled: data.settled || {},
    slips: data.slips || {},
    tripName: data.tripName || ''
  };
}

// กวาดลบ session ที่ไม่มีความเคลื่อนไหวเกิน 7 วัน (รันตอนเปิดแอป อย่างมากทุก 6 ชม.)
function cleanupOldSessions() {
  const last = +(localStorage.getItem('ppu_last_cleanup') || 0);
  if (Date.now() - last < 6 * 60 * 60 * 1000) return;
  localStorage.setItem('ppu_last_cleanup', String(Date.now()));
  const cutoff = Date.now() - SESSION_TTL_MS;
  db.ref('sessionMeta').orderByChild('updatedAt').endAt(cutoff).once('value', snap => {
    const updates = {};
    snap.forEach(child => {
      updates['sessions/' + child.key] = null;
      updates['sessionMeta/' + child.key] = null;
    });
    if (Object.keys(updates).length) db.ref().update(updates);
  }).catch(() => {});
}

async function handleQRUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (file.size > 8 * 1024 * 1024) { toast('ไฟล์ใหญ่เกินไป (สูงสุด 8MB)'); event.target.value = ''; return; }
  try {
    const compressed = await compressImage(file);
    if (!state.qrcodes) state.qrcodes = {};
    state.qrcodes[currentQRMember] = compressed;
    saveState();
    renderQRModalContent(currentQRMember);
    renderMembers();
    toast('อัพโหลด QR แล้ว ✓');
  } catch (e) {
    toast('อัพโหลดไม่สำเร็จ');
  }
  event.target.value = '';
}

function deleteQR(name) {
  const prev = state.qrcodes && state.qrcodes[name];
  if (!prev) return;
  delete state.qrcodes[name];
  saveState();
  renderQRModalContent(name);
  renderMembers();
  toast(`ลบ QR ของ ${name} แล้ว`, { action: 'เลิกทำ', onAction: () => {
    if (!state.qrcodes) state.qrcodes = {};
    state.qrcodes[name] = prev;
    saveState(); renderMembers();
    if (currentQRMember === name) renderQRModalContent(name);
  } });
}

async function compressImage(file, MAX = 700) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = e => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h / w * MAX); w = MAX; }
          else { w = Math.round(w / h * MAX); h = MAX; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.88));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function leaveSession() {
  if (sessionRef) { sessionRef.off(); sessionRef = null; }
  clearIdentity();
  sessionId = null; isSharedSession = false;
  isSyncingFromRemote = false; identityModalShown = false;
  pushUrlParam(null);
  loadLocalState();
  renderAll();
  renderSessionCard();

  sessionRef.on('value', snapshot => {

    state = normalizeState(data);
    renderAll();
    renderSessionCard();
    if (document.querySelector('.nav-item.active')?.dataset.tab === 'results') renderResults();

    setSyncDot('on');
    if (!identityModalShown && !getIdentity() && state.members.length > 0) {

      setTimeout(() => showIdentityModal(), 400);
    }
  });
  db.ref('.info/connected').on('value', snap => {

// ─── สแกนบิล / สลิป (Gemini ผ่าน Cloudflare Worker) ───────────────────────────
// โควตาจริงนับที่ Worker (ต่อนาที / ต่อวัน / ต่อ IP) หน้าเว็บแค่แสดงผลและปิดปุ่มเมื่อต้องรอ
let scanBusy = false, scanUsage = null, scanBlockedUntil = 0, scanUnblockTimer = null;
const SCAN_KIND = { receipt: 'ใบเสร็จ', transfer_slip: 'สลิปโอน', bill: 'บิล', other: 'เอกสาร' };
const SCAN_FAIL = {
  not_document: 'รูปนี้ไม่น่าใช่บิลหรือสลิป ลองถ่ายใหม่ให้เห็นยอดชัดๆ',
  no_total: 'อ่านยอดเงินไม่ออก ลองถ่ายให้ชัดขึ้น หรือกรอกเอง',
};

function initScanUi() {
  document.getElementById('exp-scan-row').hidden = !SCAN_API_URL;
  document.getElementById('exp-scan-info').hidden = true;
  if (!SCAN_API_URL) return;
  renderScanUi();
  fetch(SCAN_API_URL + '/usage').then(r => (r.ok ? r.json() : null)).then(d => { if (d) applyScanUsage(d.usage); }).catch(() => {});
}

function applyScanUsage(usage) {
  if (!usage || !usage.day) return;
  scanUsage = usage;
  let wait = usage.cooldown || 0;
  if (usage.day.used >= usage.day.limit) wait = Math.max(wait, usage.day.resetIn);
  if (wait) blockScan(wait); else renderScanUi();
}

function blockScan(seconds) {
  scanBlockedUntil = Math.max(scanBlockedUntil, Date.now() + seconds * 1000);
  clearTimeout(scanUnblockTimer);
  scanUnblockTimer = setTimeout(renderScanUi, scanBlockedUntil - Date.now() + 250);
  renderScanUi();
}

function renderScanUi() {
  const btn = document.getElementById('exp-scan-btn');
  const usageEl = document.getElementById('exp-scan-usage');
  const wait = Math.ceil((scanBlockedUntil - Date.now()) / 1000);
  btn.disabled = scanBusy || wait > 0;
  btn.innerHTML = scanBusy ? '<span class="spin"></span> AI กำลังอ่าน…' : '📷 สแกนบิล / สลิป';
  if (wait > 120) {
    usageEl.className = 'scan-usage out';
    usageEl.textContent = `โควตาวันนี้หมดแล้ว · ใช้ได้อีกครั้ง ${new Date(scanBlockedUntil).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })} น.`;
  } else if (wait > 0) {
    usageEl.className = 'scan-usage low';
    usageEl.textContent = `ใช้ถี่เกินไป รอประมาณ ${wait} วินาที`;
  } else if (scanUsage) {
    const { used, limit } = scanUsage.day;
    usageEl.className = 'scan-usage' + (limit - used <= limit * 0.2 ? ' low' : '');
    usageEl.textContent = `AI วันนี้ ${used}/${limit} ครั้ง`;
  } else {
    usageEl.textContent = '';
  }
}

function startBillScan() { if (!scanBusy) document.getElementById('bill-file-input').click(); }

async function handleBillScan(event) {
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if (!file || scanBusy) return;
  scanBusy = true; renderScanUi();
  try {
    const dataUrl = await compressImage(file, 1600);
    const res = await fetch(SCAN_API_URL + '/scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: dataUrl.split(',')[1], mimeType: 'image/jpeg' }),
    });
    const data = await res.json().catch(() => ({}));
    if (data.usage) applyScanUsage(data.usage);
    if (res.status === 429) {
      blockScan(data.retryAfter || 60);
      toast(data.reason === 'day' ? 'ใช้ AI ครบโควตาวันนี้แล้ว' : data.reason === 'ip' ? 'เครื่องนี้สแกนครบโควตาวันนี้แล้ว' : `ใช้ AI ถี่เกินไป รอ ${data.retryAfter || 60} วินาที`);
    } else if (!res.ok) {
      toast('สแกนไม่สำเร็จ ลองใหม่อีกครั้ง');
    } else if (!data.ok) {
      toast(SCAN_FAIL[data.result && data.result.reason] || 'อ่านบิลไม่สำเร็จ');
    } else {
      fillFromScan(data.result);
    }
  } catch (e) {
    toast('สแกนไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองใหม่');
  } finally {
    scanBusy = false; renderScanUi();
  }
}

// AI แค่กรอกให้ — ผู้ใช้ยังต้องตรวจและกดบันทึกเอง
function fillFromScan(r) {
  const name = document.getElementById('exp-name'), amount = document.getElementById('exp-amount');
  name.value = r.title;
  amount.value = r.total;
  [name, amount].forEach(f => f.classList.remove('invalid'));
  updateSplitPreview();
  const low = r.confidence < 0.7;
  const date = r.date ? new Date(r.date + 'T00:00:00').toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
  const info = document.getElementById('exp-scan-info');
  info.className = 'scan-info' + (low ? ' warn' : '');
  info.innerHTML = `🤖 อ่านจาก${SCAN_KIND[r.kind] || 'เอกสาร'}: <b>${escHtml(r.merchant || r.title)}</b> · ฿${r.total.toLocaleString('th-TH', { maximumFractionDigits: 2 })}${date ? ' · ' + date : ''}<br>`
    + (low ? '⚠️ AI ไม่ค่อยมั่นใจ ตรวจยอดอีกครั้งก่อนบันทึก' : 'ตรวจชื่อกับยอด แล้วเลือกคนหารได้เลย');
  info.hidden = false;
}

function participantEls() { return Array.from(document.querySelectorAll('#exp-participants .check-item')); }
function setParticipant(el, on) { el.classList.toggle('selected', on); el.setAttribute('aria-pressed', on); }
function onParticipantsChanged() {
  if (document.getElementById('weight-toggle').checked) updateWeightInputs();
  const all = participantEls().every(el => el.classList.contains('selected'));

function toggleParticipant(el) { setParticipant(el, !el.classList.contains('selected')); onParticipantsChanged(); }
function toggleAllParticipants() {
  const els = participantEls();
  const all = els.every(el => el.classList.contains('selected'));
  els.forEach(el => setParticipant(el, !all));
  onParticipantsChanged();
}
function toggleWeights() { const on = document.getElementById('weight-toggle').checked; document.getElementById('weight-section').style.display = on ? 'block' : 'none'; if (on) updateWeightInputs(); updateSplitPreview(); }
function getSelectedParticipants() { return participantEls().filter(e => e.classList.contains('selected')).map(e => e.dataset.name); }
function getWeightsFromForm() {
  if (!document.getElementById('weight-toggle').checked) return null;
  const weights = {};
  document.querySelectorAll('.weight-item').forEach(el => { weights[el.dataset.name] = parseFloat(el.querySelector('input').value) || 1; });
  return weights;
}

// พรีวิวสดว่าหารแล้วแต่ละคนจ่ายเท่าไหร่ — ใช้ calcPerPerson ตัวเดียวกับหน้าสรุป ตัวเลขจึงตรงกันเสมอ
function updateSplitPreview() {
  const el = document.getElementById('exp-preview');
  const amount = parseFloat(document.getElementById('exp-amount').value);
  const participants = getSelectedParticipants();
  if (!(amount > 0) || !participants.length) {
    el.className = 'split-preview empty-hint';
    el.textContent = !participants.length ? 'เลือกคนร่วมหารอย่างน้อย 1 คน' : 'ใส่ราคา แล้วจะเห็นว่าแต่ละคนต้องจ่ายเท่าไหร่';
    return;
  }
  el.className = 'split-preview';
  const weights = getWeightsFromForm();
  const shares = calcPerPerson({ amount, participants, weights });
  const sum = participants.reduce((t, m) => t + shares[m], 0);
  const rounded = sum !== amount ? ' <span style="color:var(--muted);font-size:12px">(ปัดเศษขึ้นเป็นบาทเต็ม)</span>' : '';
  el.innerHTML = weights
    ? `หารตามน้ำหนัก ${participants.length} คน${rounded}<div class="split-pills">${participants.map(m => `<span class="share-pill">${escHtml(m)} <b>฿${fmt(shares[m])}</b></span>`).join('')}</div>`
    : `หาร ${participants.length} คน · คนละ <b>฿${fmt(shares[participants[0]])}</b>${rounded}`;
}
function updateWeightInputs() {
  const selected = getSelectedParticipants();
  const existing = {};
  document.querySelectorAll('.weight-item').forEach(el => { existing[el.dataset.name] = el.querySelector('input').value; });
  renderWeightInputs(selected, existing);
}
document.getElementById('exp-weights').addEventListener('input', updateSplitPreview);
document.getElementById('exp-amount').addEventListener('input', e => { e.target.classList.remove('invalid'); updateSplitPreview(); });
document.getElementById('exp-name').addEventListener('input', e => e.target.classList.remove('invalid'));
// Enter ที่ชื่อ → ไปช่องราคา, Enter ที่ราคา → บันทึก
document.getElementById('exp-name').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); document.getElementById('exp-amount').focus(); } });

function renderWeightInputs(members, existing = {}) {

function saveExpense() {
  const name = document.getElementById('exp-name').value.trim();
  const amount = parseFloat(document.getElementById('exp-amount').value);
  const payer = document.getElementById('exp-payer').value;
  const participants = getSelectedParticipants();
  const invalid = (id, msg) => { const f = document.getElementById(id); f.classList.add('invalid'); f.focus(); toast(msg); };
  if (!name) { invalid('exp-name', 'ระบุชื่อรายการด้วย'); return; }
  if (!amount || amount <= 0) { invalid('exp-amount', 'ระบุราคาด้วย'); return; }
  if (!participants.length) { toast('เลือกคนร่วมหารอย่างน้อย 1 คน'); return; }
  const weights = getWeightsFromForm();
  if (editingExpenseId) {
    const idx = state.expenses.findIndex(e => e.id === editingExpenseId);
    state.expenses[idx] = { id: editingExpenseId, name, amount, payer, participants, weights };
  } else {
    state.expenses.push({ id: Date.now().toString(), name, amount, payer, participants, weights });
  }
  saveState(); renderExpenses(); closeExpenseModal(); toast('บันทึกแล้ว ✓');
}
function deleteExpense(id) {
  const idx = state.expenses.findIndex(e => e.id === id);
  if (idx < 0) return;
  const [exp] = state.expenses.splice(idx, 1);
  saveState(); renderExpenses();
  toast(`ลบ "${exp.name}" แล้ว`, { action: 'เลิกทำ', onAction: () => {
    if (state.expenses.some(e => e.id === exp.id)) return;
    state.expenses.splice(Math.min(idx, state.expenses.length), 0, exp);
    saveState(); renderExpenses(); toast('กู้คืนรายการแล้ว');
  } });
}
function renderExpenses() {

// ─── Calculation ──────────────────────────────────────────────────────────────
function calcPerPerson(exp) {
  const result = {};
  if (exp.weights) {
    const totalW = exp.participants.reduce((s, m) => s + (exp.weights[m] || 1), 0);
    exp.participants.forEach(m => { result[m] = Math.ceil((exp.weights[m] || 1) / totalW * exp.amount); });
  } else {
    const share = Math.ceil(exp.amount / exp.participants.length);
    exp.participants.forEach(m => { result[m] = share; });
  }
  return result;
}
function calcAll() {
  const paid = {}, owed = {};
  state.members.forEach(m => { paid[m] = 0; owed[m] = 0; });
  state.expenses.forEach(exp => {
    paid[exp.payer] = (paid[exp.payer] || 0) + exp.amount;
    const shares = calcPerPerson(exp);
    exp.participants.forEach(m => { owed[m] = (owed[m] || 0) + shares[m]; });
  });
  const net = {};
  state.members.forEach(m => { net[m] = (paid[m] || 0) - (owed[m] || 0); });
  return { paid, owed, net };
}
function minTransfers(net) {
  const creditors = [], debtors = [];
  Object.entries(net).forEach(([name, val]) => {
    if (val > 0.5) creditors.push({ name, amount: val });
    else if (val < -0.5) debtors.push({ name, amount: -val });
  });
  creditors.sort((a, b) => b.amount - a.amount);
  debtors.sort((a, b) => b.amount - a.amount);
  const transfers = [];
  let i = 0, j = 0;
  while (i < debtors.length && j < creditors.length) {
    const pay = Math.min(debtors[i].amount, creditors[j].amount);
    transfers.push({ from: debtors[i].name, to: creditors[j].name, amount: Math.round(pay) });
    debtors[i].amount -= pay; creditors[j].amount -= pay;
    if (debtors[i].amount < 0.5) i++;
    if (creditors[j].amount < 0.5) j++;
  }
  return transfers;
}

// ─── Results ─────────────────────────────────────────────────────────────────
function renderResults() {
  const el = document.getElementById('results-content');
  if (!state.expenses.length) { el.innerHTML = `<div class="empty"><span class="icon">📊</span>ยังไม่มีข้อมูลค่าใช้จ่าย<br>ไปที่แท็บ "ค่าใช้จ่าย" เพื่อเพิ่มรายการ</div>`; return; }
  const { paid, owed, net } = calcAll();
  const sorted = minTransfers(net).sort((a, b) => b.amount - a.amount);
  el.innerHTML = isMobileView()
    ? mobileResultsHtml(paid, owed, net, sorted)
    : desktopResultsHtml(paid, owed, net, sorted);
}

function tripTotals() {
  const totalSpent = state.expenses.reduce((s, e) => s + e.amount, 0);
  return { totalSpent, avgPerHead: state.members.length ? totalSpent / state.members.length : 0 };
}
function tripNameHtml() {
  return state.tripName ? `<div class="results-trip-name">📍 ${escHtml(state.tripName)}</div>` : '';
}

function perExpenseHtml() {
  return `<div class="grid-2">` + state.expenses.map(exp => {
    const shares = calcPerPerson(exp);
    return `<div class="res-item">
      <div class="res-head">
        <div class="res-name">${escHtml(exp.name)}</div>
        <div class="res-amount">฿${fmt(exp.amount)}</div>
      </div>
      <div class="res-payer">💳 ${escHtml(exp.payer)} ออกก่อน${exp.weights ? ' • ⚖️ หารตามน้ำหนัก' : ''}</div>
      <div class="res-shares">
        ${exp.participants.map(m => `<span class="share-pill">${escHtml(m)} <b>฿${fmt(shares[m])}</b></span>`).join('')}

}

function perPersonHtml(paid, owed, net, bare) {

    else if (n < -0.5) { badge = 'badge-red'; txt = `ต้องจ่าย ฿${fmt(-n)}`; }
    else { badge = 'badge-neutral'; txt = 'เสมอ'; }
    return `<div class="person-row">

        <div class="person-sub">ออกก่อน ฿${fmt(paid[m])} • ต้องจ่าย ฿${fmt(owed[m])}</div>
      </div>

}

function transfersHtml(sorted) {
  if (!sorted.length) {
    return `<div class="card"><p style="color:var(--green);text-align:center;font-weight:600">✅ ทุกคนจ่ายเท่ากัน ไม่ต้องโอน!</p></div>`;
  }
  const doneCount = sorted.filter(t => state.settled[settleKey(t)]).length;
  const pct = Math.round(doneCount / sorted.length * 100);
  return `<p class="settle-progress">โอนแล้ว <b style="color:${doneCount === sorted.length ? 'var(--green)' : 'var(--accent2)'}">${doneCount}/${sorted.length}</b> ธุรกรรม</p>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="grid-2">` + sorted.map(t => {
    const key = settleKey(t);
    const done = !!state.settled[key];
    const hasSlip = !!(state.slips && state.slips[key]);
    return `<div class="transfer-item${done ? ' settled' : ''}">
      <div class="transfer-top">
        <div class="transfer-names">
          <span style="color:var(--red)">${escHtml(t.from)}</span>
          <span class="arrow">→</span>
          <span style="color:var(--green)">${escHtml(t.to)}</span>
          ${hasSlip ? '<span title="มีสลิป" style="margin-left:6px">📎</span>' : ''}
        </div>
        <div class="transfer-amount">฿${fmt(t.amount)}</div>
      </div>
      <div class="transfer-actions">
        <button class="pay-btn" onclick="openPayModal(${jsArg(t.from)},${jsArg(t.to)},${t.amount})">💸 โอนเงิน / ดู QR</button>
        <button class="settle-btn${done ? ' done' : ''}" aria-pressed="${done}" onclick="toggleSettled(${jsArg(key)})">${done ? '✓ โอนแล้ว' : '☐ โอนแล้ว'}</button>
      </div>
    </div>`;
  }).join('') + `</div>`;
}

function mobileResultsHtml(paid, owed, net, sorted) {

  return tripNameHtml()
    + meCardHtml(net, sorted)
    + `<div class="mini-stats">
        <div class="mini-stat"><div class="ms-val">฿${fmt(totalSpent)}</div><div class="ms-label">ยอดรวมทริป</div></div>
        <div class="mini-stat"><div class="ms-val">฿${fmt(avgPerHead)}</div><div class="ms-label">เฉลี่ย/คน</div></div>
        <div class="mini-stat"><div class="ms-val">${state.expenses.length}</div><div class="ms-label">รายการ</div></div>

    + secHtml('👥 สรุปต่อคน', `${state.members.length} คน`, perPersonHtml(paid, owed, net, true))
    + secHtml('💸 รายการโอนทั้งกลุ่ม', sorted.length ? `${doneCount}/${sorted.length}` : 'ไม่ต้องโอน', transfersHtml(sorted))
    + secHtml('🧾 รายการทั้งหมด', `${state.expenses.length} รายการ`, perExpenseHtml());

function secHtml(title, count, body) {
  return `<details class="sec">
    <summary>${title}<span class="sec-count">${escHtml(count)}</span></summary>
    <div class="sec-body">${body}</div>
  </details>`;
}

function meCardHtml(net, sorted) {
  const me = getIdentity();
  if (!me || !state.members.includes(me)) {
    return `<div class="me-card even me-card-empty">
      <div class="me-q">คุณคือใครในกลุ่มนี้?</div>
      <div class="me-sub">เลือกชื่อตัวเอง แล้วหน้านี้จะบอกทันทีว่าต้องโอนให้ใคร เท่าไหร่</div>
      <button class="btn btn-primary" onclick="showIdentityModal()">👤 เลือกชื่อของฉัน</button>
    </div>`;
  }
  const n = net[me] || 0;
  const owe = n < -0.5, get = n > 0.5;
  const mine = sorted.filter(t => owe ? t.from === me : get ? t.to === me : false);
  const rows = mine.map(t => {
    const key = settleKey(t);
    const done = !!state.settled[key];
    return `<div class="me-row${done ? ' done' : ''}">
      <span class="me-row-name">${owe ? `โอนให้ <b>${escHtml(t.to)}</b>` : `<b>${escHtml(t.from)}</b> ต้องโอนให้คุณ`}</span>
      <span class="me-row-amt">฿${fmt(t.amount)}</span>
      ${owe
        ? `<button class="me-row-btn${done ? ' ok' : ''}" onclick="openPayModal(${jsArg(t.from)},${jsArg(t.to)},${t.amount})">${done ? '✓ โอนแล้ว' : '💸 โอนเลย'}</button>`
        : `<button class="me-row-btn ${done ? 'ok' : 'check'}" aria-pressed="${done}" onclick="toggleSettled(${jsArg(key)})">${done ? '✓ ได้รับแล้ว' : '☐ ได้รับแล้ว'}</button>`}
    </div>`;
  }).join('');
  return `<div class="me-card ${owe ? 'owe' : get ? 'get' : 'even'}">
    <div class="me-top">👤 ${escHtml(me)}${owe ? ' • ต้องจ่าย' : get ? ' • รับคืน' : ''}</div>
    <div class="me-amount">${owe ? `฿${fmt(-n)}` : get ? `฿${fmt(n)}` : '✓ เคลียร์แล้ว'}</div>
    ${rows ? `<div class="me-rows">${rows}</div>` : ''}
  </div>`;
}

function settleKey(t) { return `${t.from}__${t.to}__${t.amount}`; }

function toggleSettled(key) {
  if (!state.settled) state.settled = {};
  if (state.settled[key]) delete state.settled[key];
  else state.settled[key] = true;
  saveState();
  renderResults();
  if (currentPay && currentPay.key === key) renderPayModal();
}

// ─── Pay Modal (QR + Slip) ────────────────────────────────────────────────────
let currentPay = null;

function openPayModal(from, to, amount) {
  currentPay = { from, to, amount, key: settleKey({ from, to, amount }) };
  renderPayModal();
  document.getElementById('pay-modal').classList.add('open');
}

function closePayModal() {
  document.getElementById('pay-modal').classList.remove('open');
  currentPay = null;
}

function renderPayModal() {
  const p = currentPay;
  if (!p) return;
  document.getElementById('pay-title').textContent = `${p.from} → ${p.to}`;
  document.getElementById('pay-sub').textContent = `ยอดโอน ฿${fmt(p.amount)}`;

  // ผู้รับ QR
  const qr = state.qrcodes && state.qrcodes[p.to];
  document.getElementById('pay-qr').innerHTML = qr
    ? `<div class="pay-sec-label">📱 สแกน QR ของ ${escHtml(p.to)} เพื่อโอน</div><div class="qr-img-wrap"><img src="${qr}" alt="QR ${escHtml(p.to)}"></div>`
    : `<div class="qr-empty">📱<br><br>${escHtml(p.to)} ยังไม่ได้ใส่ QR PromptPay<br><span style="font-size:12px">บอกให้เจ้าตัวไปแนบ QR ในแท็บสมาชิก</span></div>`;

  // สลิป
  const slip = state.slips && state.slips[p.key];
  document.getElementById('pay-slip').innerHTML = slip
    ? `<div class="pay-sec-label">📎 สลิปการโอน</div><div class="slip-thumb"><img src="${slip}" alt="สลิป"></div>`
    : '';

  // ปุ่ม
  const done = !!state.settled[p.key];
  let btns = `<button class="btn btn-ghost" onclick="document.getElementById('slip-file-input').click()" style="width:100%;margin-bottom:8px">📷 ${slip ? 'เปลี่ยนสลิป' : 'แนบสลิปการโอน'}</button>`;
  if (slip) btns += `<button class="btn btn-ghost btn-sm" onclick="deleteSlip()" style="width:100%;margin-bottom:8px;color:var(--red);border-color:rgba(248,113,113,.4)">🗑 ลบสลิป</button>`;
  btns += `<button class="btn ${done ? 'btn-ghost' : 'btn-primary'}" onclick="toggleSettled(${jsArg(p.key)})" style="width:100%;margin-bottom:8px${done ? ';color:var(--green);border-color:rgba(34,197,94,.4)' : ''}">${done ? '✓ โอนแล้ว (กดเพื่อยกเลิก)' : 'ทำเครื่องหมายว่าโอนแล้ว'}</button>`;
  btns += `<button class="btn btn-ghost" onclick="closePayModal()" style="width:100%">ปิด</button>`;
  document.getElementById('pay-actions').innerHTML = btns;
}

async function handleSlipUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (file.size > 8 * 1024 * 1024) { toast('ไฟล์ใหญ่เกินไป (สูงสุด 8MB)'); event.target.value = ''; return; }
  try {
    const compressed = await compressImage(file);
    if (!state.slips) state.slips = {};
    state.slips[currentPay.key] = compressed;
    state.settled[currentPay.key] = true; // แนบสลิป = ถือว่าโอนแล้ว
    saveState();
    renderPayModal();
    renderResults();
    toast('แนบสลิปแล้ว ✓');
  } catch (e) {
    toast('แนบสลิปไม่สำเร็จ');
  }
  event.target.value = '';
}

function deleteSlip() {
  if (!currentPay) return;
  const key = currentPay.key;
  const prev = state.slips && state.slips[key];
  if (!prev) return;
  delete state.slips[key];
  saveState();
  renderPayModal();
  renderResults();
  toast('ลบสลิปแล้ว', { action: 'เลิกทำ', onAction: () => {
    if (!state.slips) state.slips = {};
    state.slips[key] = prev;
    saveState(); renderResults();
    if (currentPay && currentPay.key === key) renderPayModal();
  } });
}

// ─── Session Actions ──────────────────────────────────────────────────────────
async function newSession() {
  const ok = await confirmSheet({
    title: 'ล้างข้อมูลทั้งหมด?',
    message: isSharedSession
      ? 'จะออกจาก Session แชร์ และล้างข้อมูลในเครื่องนี้ ข้อมูลของกลุ่มยังอยู่ เปิดลิงก์เดิมเพื่อกลับเข้าได้'
      : 'สมาชิก รายการค่าใช้จ่าย QR และสลิปทั้งหมดในเครื่องนี้จะหายไป และกู้คืนไม่ได้',
    confirmLabel: 'ล้างข้อมูล',
  });
  if (!ok) return;
  if (isSharedSession) leaveSession();
  state = { members: [], expenses: [], qrcodes: {}, settled: {}, slips: {}, tripName: '' };
  persistLocal(); renderAll(); toast('ล้างข้อมูลแล้ว');
}
function exportSession() {
  if (!state.expenses.length) { toast('ยังไม่มีข้อมูล'); return; }
  const { net } = calcAll();
  const transfers = minTransfers(net);
  const total = state.expenses.reduce((s, e) => s + e.amount, 0);
  let text = '💸 PayPerUsed — สรุปค่าใช้จ่าย\n';
  if (state.tripName) text += `📍 ${state.tripName}\n`;
  text += '─'.repeat(30) + '\n';
  text += `📋 ${state.expenses.length} รายการ • ยอดรวม ฿${fmt(total)}\n\n👤 สรุปต่อคน\n`;
  state.members.forEach(m => {
    const n = net[m];
    text += `  ${m}: ${n > 0.5 ? `รับคืน ฿${fmt(n)}` : n < -0.5 ? `ต้องจ่าย ฿${fmt(-n)}` : 'เสมอ'}\n`;
  });
  text += '\n💸 รายการโอน\n';
  if (!transfers.length) text += '  ไม่ต้องโอน\n';
  else transfers.forEach(t => { text += `  ${state.settled[settleKey(t)] ? '✅' : '⬜'} ${t.from} → ${t.to}: ฿${fmt(t.amount)}\n`; });
  navigator.clipboard.writeText(text).then(() => toast('คัดลอกแล้ว ✓')).catch(() => toast('คัดลอกไม่ได้'));
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function isMobileView() { return window.matchMedia('(max-width: 767px)').matches; }
function currentTab() { return document.querySelector('.nav-item.active')?.dataset.tab; }
function fmt(n) { return Math.round(n).toLocaleString('th-TH'); }
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return String(s).replace(/'/g,'&#39;').replace(/"/g,'&quot;'); }
// ใช้แทน '${escAttr(x)}' ใน onclick — HTML parser แปลง &#39; กลับเป็น ' ก่อนรัน JS ทำให้ชื่อสมาชิกที่มี ' หลุดออกจาก string ได้ (XSS)
// JSON.stringify ให้ string literal ที่ถูกต้องเสมอ แล้ว escHtml กัน " ไม่ให้ปิด attribute
function jsArg(s) { return escHtml(JSON.stringify(String(s))); }
function renderAll() { renderTripName(); renderMembers(); renderExpenses(); }

function renderTripName() {
  const input = document.getElementById('trip-name');
  if (input && document.activeElement !== input) input.value = state.tripName || '';
}

let tripNameTimer = null;
function onTripNameInput() {
  state.tripName = document.getElementById('trip-name').value;
  clearTimeout(tripNameTimer);
  tripNameTimer = setTimeout(saveState, 600);
}

// ─── Init ─────────────────────────────────────────────────────────────────────
const urlSession = new URLSearchParams(location.search).get('s');
if (urlSession) {
  joinSession(urlSession);
} else {
  loadLocalState();
  renderAll();
  renderSessionCard();
  setSyncDot('off');
}
cleanupOldSessions();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
document.getElementById('new-member').addEventListener('keydown', e => { if (e.key === 'Enter') addMember(); });

// ─── Mobile gestures ──────────────────────────────────────────────────────────
const SWIPE_REVEAL = 128;   // ต้องตรงกับ .swipe-wrap.open .swipe-content ใน CSS
const TAB_ORDER = ['members', 'expenses', 'results'];

function closeSwipedRows(except) {
  document.querySelectorAll('.swipe-wrap.open').forEach(w => {
    if (w === except) return;
    w.classList.remove('open');
    w.querySelector('.swipe-content').style.transform = '';
  });
}

// ปัดรายการค่าใช้จ่ายซ้ายเพื่อเผยปุ่มแก้ไข/ลบ
let rowSwipe = null;
const expenseListEl = document.getElementById('expense-list');

expenseListEl.addEventListener('touchstart', e => {
  const content = e.target.closest('.swipe-content');
  if (!content) return;
  const wrap = content.parentElement;
  closeSwipedRows(wrap);
  rowSwipe = {
    wrap, content, axis: null, dx: 0,
    x: e.touches[0].clientX, y: e.touches[0].clientY,
    start: wrap.classList.contains('open') ? -SWIPE_REVEAL : 0
  };
  content.style.transition = 'none';
}, { passive: true });

expenseListEl.addEventListener('touchmove', e => {
  if (!rowSwipe) return;
  const dx = e.touches[0].clientX - rowSwipe.x;
  const dy = e.touches[0].clientY - rowSwipe.y;
  if (!rowSwipe.axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) rowSwipe.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
  if (rowSwipe.axis !== 'x') return;
  rowSwipe.dx = dx;
  rowSwipe.content.style.transform = `translateX(${Math.min(0, Math.max(-SWIPE_REVEAL, rowSwipe.start + dx))}px)`;
}, { passive: true });

function endRowSwipe() {
  if (!rowSwipe) return;
  const { wrap, content, start, dx, axis } = rowSwipe;
  const open = axis === 'x' ? start + dx < -SWIPE_REVEAL / 2 : wrap.classList.contains('open');
  rowSwipe = null;
  content.style.transition = '';
  content.style.transform = '';
  wrap.classList.toggle('open', open);
}
expenseListEl.addEventListener('touchend', endRowSwipe);
expenseListEl.addEventListener('touchcancel', endRowSwipe);
document.addEventListener('click', e => { if (!e.target.closest('.swipe-wrap')) closeSwipedRows(null); });

// ปัดซ้าย-ขวาเพื่อเปลี่ยนแท็บ
let pageSwipe = null;
const mainEl = document.querySelector('main');

mainEl.addEventListener('touchstart', e => {
  pageSwipe = (isMobileView() && e.touches.length === 1 && !e.target.closest('.swipe-content'))
    ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null;
}, { passive: true });

mainEl.addEventListener('touchend', e => {
  if (!pageSwipe) return;
  const dx = e.changedTouches[0].clientX - pageSwipe.x;
  const dy = e.changedTouches[0].clientY - pageSwipe.y;
  pageSwipe = null;
  if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 2) return;
  const next = TAB_ORDER.indexOf(currentTab()) + (dx < 0 ? 1 : -1);
  if (next < 0 || next >= TAB_ORDER.length) return;
  document.querySelector(`.nav-item[data-tab="${TAB_ORDER[next]}"]`)?.click();
}, { passive: true });

// มือถือกับเดสก์ท็อปใช้คนละโครงสร้าง ต้อง render ใหม่เมื่อข้าม breakpoint
window.matchMedia('(max-width: 767px)').addEventListener('change', () => {
  renderExpenses();
  if (currentTab() === 'results') renderResults();
});
</script>
